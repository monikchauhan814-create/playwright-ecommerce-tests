trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self

- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    npm ci
  displayName: 'Install project dependencies'

- script: |
    docker compose up -d
    docker compose ps
  displayName: 'Start OpenCart and MySQL'

- script: |
    echo "=== CONTAINER STATUS ==="
    docker compose ps -a

    echo "=== OPENCART CONTAINER LOGS ==="
docker logs $(docker compose ps -aq opencart) 2>&1 || true

echo "=== OPENCART INSPECT ==="
docker inspect $(docker compose ps -aq opencart) \
  --format='ExitCode={{.State.ExitCode}} Error={{.State.Error}}' || true

    echo "=== OPENCART LOGS ==="
    docker compose logs opencart

    echo "=== TESTING OPENCART ==="
    curl -v http://localhost:8080 || true
  displayName: 'Diagnose Docker environment'

- script: |
    npx playwright install --with-deps chromium
  displayName: 'Install Playwright Chromium'

- script: |
    npx playwright test --project=chromium
  displayName: 'Run Playwright tests'

- task: PublishPipelineArtifact@1
  condition: always()
  inputs:
    targetPath: 'playwright-report'
    artifact: 'playwright-report'
    publishLocation: 'pipeline'
  displayName: 'Publish Playwright HTML report'

- script: |
    docker compose down
  condition: always()
  displayName: 'Stop Docker environment'